{% extends "admin/base.html" %}
{% load i18n %}

{% block usertools %}
<form action="{% url 'set_language' %}" method="post" style="display: inline-block; margin-inline-end: 15px;">
    {% csrf_token %}
    <input type="hidden" name="next" id="lang-next-input" value="{{ request.get_full_path }}" />

    {% get_current_language as CURRENT_LANG %}
    {% get_available_languages as LANGUAGES %}

    <select name="language" onchange="
      var lang = this.value;
      var path = window.location.pathname;
      if (lang === 'en') {
        path = path.replace(/^\/ar\//, '/');
      } else if (lang === 'ar' && !path.startsWith('/ar/')) {
        path = '/ar' + path;
      }
      document.getElementById('lang-next-input').value = path + window.location.search;
      this.form.submit();
    " style="padding: 3px 8px; border-radius: 4px; font-size: 12px; cursor: pointer;">
        {% for lang_code, lang_name in LANGUAGES %}
        <option value="{{ lang_code }}" {% if lang_code == CURRENT_LANG %}selected{% endif %}>
            {{ lang_name }}
        </option>
        {% endfor %}
    </select>
</form>

{{ block.super }}
{% endblock %}
